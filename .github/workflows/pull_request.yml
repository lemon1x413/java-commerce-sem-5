name: Build and Test Coverage

on:
  pull_request:
    branches:
      - main
      - '**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The project toolchain is Java 24 (see build.gradle)
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # build = compile + unit tests + integration tests + JaCoCo report + coverage verification
      - name: Build with Gradle
        run: ./gradlew build

      - name: Add test summary to the job
        if: always()
        run: cat build/reports/tests/test-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: build/reports/coverage/
